<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Munição</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #111a2d;
        --panel: #18233d;
        --panel-strong: #1d2c4a;
        --surface: #0f172b;
        --text: #e6edf7;
        --muted: #9fb3d9;
        --primary: #4fa3ff;
        --primary-strong: #2c7df6;
        --success: #2ecc71;
        --warning: #f4b942;
        --danger: #ef5a5a;
        --border: rgba(255, 255, 255, 0.09);
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #09111b 0%, #111a2d 100%);
        color: var(--text);
      }

      body {
        padding: 28px 18px 40px;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 20px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(17, 26, 45, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 1.6rem + 2vw, 3rem);
        letter-spacing: 0.02em;
        text-align: center;
      }

      .subtitle {
        margin-top: 8px;
        text-align: center;
        font-size: 1.05rem;
        color: var(--muted);
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        margin: 24px 0 18px;
        padding: 18px 20px;
        border-radius: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .toolbar select,
      .toolbar button,
      td select,
      td input {
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 0.96rem;
      }

      .general-discount-box {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .general-discount-box label {
        font-weight: 700;
        color: var(--text);
      }

      .toolbar select,
      td select,
      td input {
        min-height: 44px;
        padding: 9px 12px;
      }

      .toolbar select,
      td select {
        appearance: none;
        cursor: pointer;
      }

      .toolbar button,
      .copy-btn {
        border: none;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: white;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 10px 24px rgba(44, 125, 246, 0.35);
      }

      .toolbar button:hover,
      .copy-btn:hover {
        transform: translateY(-1px);
      }

      .toolbar .secondary {
        background: linear-gradient(135deg, #5d6787, #4d5d84);
        box-shadow: 0 10px 24px rgba(93, 103, 135, 0.35);
      }

      .table-wrap {
        overflow-x: auto;
        border-radius: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 980px;
      }

      thead th {
        background: rgba(255, 255, 255, 0.02);
        color: var(--muted);
        font-size: 0.88rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 16px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      tbody td {
        padding: 16px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .ammo-name {
        font-weight: 700;
        color: var(--text);
      }

      .lot-size-text,
      .lot-price {
        color: var(--muted);
        font-weight: 600;
      }

      .qty-input {
        width: 100%;
        max-width: 150px;
        appearance: textfield;
        -moz-appearance: textfield;
      }

      .qty-input::-webkit-outer-spin-button,
      .qty-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .qty-input.invalid {
        border-color: var(--danger);
        box-shadow: 0 0 0 1px rgba(239, 90, 90, 0.35);
      }

      .quantity-message {
        display: none;
        margin-top: 8px;
        color: var(--danger);
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .quantity-message.show {
        display: block;
      }

      .discount-select {
        width: 100%;
        max-width: 140px;
      }

      .discount-wrapper {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .discount-compare {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 62px;
      }

      .price-line {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .old-price {
        text-decoration: line-through;
        opacity: 0.75;
      }

      .discount-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(239, 90, 90, 0.18);
        color: #ff8e8e;
        border: 1px solid rgba(239, 90, 90, 0.4);
        border-radius: 999px;
        padding: 4px 8px;
        font-weight: 700;
        font-size: 0.72rem;
      }

      .new-price {
        font-size: 1rem;
        font-weight: 800;
        color: var(--success);
      }

      .subtotal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 170px;
        padding: 14px 18px;
        border-radius: 12px;
        background: rgba(58, 205, 116, 0.12);
        border: 1px solid rgba(58, 205, 116, 0.3);
        color: var(--success);
        font-size: 1rem;
        font-weight: 800;
      }

      .summary {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }

      .summary-card {
        background: linear-gradient(180deg, rgba(24, 35, 61, 0.96), rgba(13, 20, 34, 0.96));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 20px;
        box-shadow: var(--shadow);
      }

      .summary-label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
      }

      .summary-number {
        font-size: clamp(1.4rem, 1.2rem + 1vw, 2.1rem);
        font-weight: 800;
        white-space: nowrap;
      }

      .summary-number.total {
        color: var(--success);
      }

      .copy-btn {
        margin-top: 22px;
        width: 100%;
        border-radius: 14px;
        font-size: 1rem;
      }

      @media (max-width: 760px) {
        body {
          padding: 18px 12px 32px;
        }

        .header,
        .toolbar,
        .summary-card {
          border-radius: 14px;
        }

        .toolbar {
          align-items: stretch;
        }

        .general-discount-box {
          width: 100%;
        }

        .general-discount-box select {
          width: 100%;
        }

        .toolbar button {
          flex: 1;
          min-width: 150px;
        }

        table {
          min-width: 760px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Calculadora de Munição</h1>
        <div class="subtitle">Preços por lote</div>
      </header>

      <section class="toolbar" aria-label="Ações da calculadora">
        <button type="button" class="secondary" id="clearQuantities">Limpar Quantidades</button>
      </section>

      <div class="table-wrap">
        <table aria-label="Tabela de cálculo de munição">
          <thead>
            <tr>
              <th>Tipo de munição</th>
              <th>Quantidade por lote</th>
              <th>Preço do lote</th>
              <th>Quantidade desejada</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody id="ammoTableBody"></tbody>
        </table>
      </div>

      <div class="toolbar" aria-label="Desconto geral e cupom" style="margin-top: 24px;">
        <div class="general-discount-box">
          <label for="generalDiscount">Desconto geral:</label>
          <select id="generalDiscount" aria-label="Desconto geral">
            <option value="0">Sem desconto</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
            <option value="25">25%</option>
            <option value="30">30%</option>
          </select>
        </div>

        <div class="general-discount-box">
          <label for="couponInput">Cupom:</label>
          <input id="couponInput" type="text" placeholder="Digite o código" aria-label="Código do cupom" />
          <button type="button" id="applyCoupon" class="secondary">Aplicar</button>
        </div>
      </div>

      <section class="summary" aria-label="Resumo financeiro">
        <div class="summary-card">
          <span class="summary-label">Total de munições</span>
          <div class="summary-number" id="totalMunicoes">0</div>
        </div>

        <div class="summary-card summary-primary">
          <span class="summary-label">Valor total</span>
          <div class="summary-number total" id="valorTotal">R$ 0,00</div>
        </div>
      </section>

      <button type="button" class="copy-btn" id="copySummary">Copiar Resumo</button>
    </div>

    <script>
      // Configuração base dos tipos de munição, com lote e preço fixos.
      const ammoConfig = [
        { key: 'PT', label: 'PT', lotSize: 100, basePrice: 110000 },
        { key: 'SMG', label: 'SMG', lotSize: 100, basePrice: 72000 },
        { key: 'ESCOPETA', label: 'Escopeta', lotSize: 15, basePrice: 165000 },
        { key: 'G3', label: 'G3', lotSize: 100, basePrice: 72000 },
        { key: 'SNIPER', label: 'Sniper', lotSize: 10, basePrice: 700000 }
      ];

      const discountOptions = [
        { value: 0, label: 'Sem desconto' },
        { value: 5, label: '5%' },
        { value: 10, label: '10%' },
        { value: 15, label: '15%' },
        { value: 20, label: '20%' },
        { value: 25, label: '25%' },
        { value: 30, label: '30%' },
        { value: 'custom', label: 'Personalizado' }
      ];

      const state = {
        couponCode: '',
        couponEnabled: false
      };

      const ammoState = ammoConfig.map((ammo) => ({
        ...ammo,
        quantity: 0,
        discount: 0,
        customDiscount: ''
      }));

      const tableBody = document.getElementById('ammoTableBody');
      const totalMunicoesElement = document.getElementById('totalMunicoes');
      const valorTotalElement = document.getElementById('valorTotal');

      function formatMoney(value) {
        return new Intl.NumberFormat('pt-BR', {
          style: 'currency',
          currency: 'BRL',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(value);
      }

      function formatCompactMoney(value) {
        if (!Number.isFinite(value)) return 'R$ 0';

        const abs = Math.abs(value);

        if (abs >= 1_000_000) {
          const compact = abs / 1_000_000;
          const rounded = compact >= 10 ? compact.toFixed(1) : compact.toFixed(1);
          return `R$ ${Number(rounded).toLocaleString('pt-BR', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 1
          })}kk`;
        }

        if (abs >= 1_000) {
          const compact = abs / 1_000;
          const rounded = compact >= 10 ? compact.toFixed(1) : compact.toFixed(1);
          return `R$ ${Number(rounded).toLocaleString('pt-BR', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 1
          })}k`;
        }

        return formatMoney(value);
      }

      function getCouponPercent() {
        if (!state.couponEnabled) return 0;
        return state.couponCode.trim().toLowerCase() === 'mito' ? 15 : 0;
      }

      function setCouponState(code) {
        const normalized = code.trim();
        state.couponCode = normalized;
        state.couponEnabled = normalized.toLowerCase() === 'mito';

        if (state.couponEnabled) {
          document.getElementById('generalDiscount').value = '0';
        }
      }

      function getDiscountForItem(item) {
        return Number(item.discount || 0);
      }

      function getEffectiveDiscount(item) {
        const selectedGeneralDiscount = Number(document.getElementById('generalDiscount')?.value || 0);
        const couponDiscount = getCouponPercent();
        return couponDiscount > 0 ? couponDiscount : selectedGeneralDiscount;
      }

      function buildDiscountOptions(selectedValue) {
        return discountOptions
          .map((option) => {
            const selected = String(option.value) === String(selectedValue) ? 'selected' : '';
            return `<option value="${option.value}" ${selected}>${option.label}</option>`;
          })
          .join('');
      }

      function sanitizeInteger(value) {
        return String(value || '').replace(/\D/g, '');
      }

      function sanitizeDecimal(value) {
        const cleaned = String(value || '').replace(/[^0-9,\.]/g, '');
        const normalized = cleaned.replace(',', '.');
        return normalized;
      }

      function renderTable() {
        tableBody.innerHTML = ammoState
          .map((item) => {
            const effectiveDiscount = getEffectiveDiscount(item);
            const currentBasePrice = item.basePrice;
            const discountedBasePrice = currentBasePrice * (1 - effectiveDiscount / 100);
            const hasDiscount = effectiveDiscount > 0;

            return `
              <tr data-key="${item.key}">
                <td><div class="ammo-name">${item.label}</div></td>
                <td><div class="lot-size-text">${item.lotSize} munições</div></td>
                <td>
                  ${hasDiscount ? `<div class="lot-price"><span class="old-price">${formatCompactMoney(currentBasePrice)}</span><br><strong class="new-price">${formatCompactMoney(discountedBasePrice)}</strong></div>` : `<div class="lot-price">${formatCompactMoney(item.basePrice)}</div>`}
                <td>
                  <input
                    type="text"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    value="${item.quantity}"
                    class="qty-input"
                    data-role="quantity"
                    data-key="${item.key}"
                    aria-label="Quantidade de ${item.label}"
                  />
                  <div class="quantity-message" data-role="message" data-key="${item.key}"></div>
                </td>
                <td><div class="subtotal" data-role="subtotal" data-key="${item.key}">R$ 0,00</div></td>
              </tr>
            `;
          })
          .join('');
      }

      function validateQuantity(item) {
        return { valid: true, message: '' };
      }

      function calculateRow(item) {
        const qty = Number(item.quantity) || 0;
        const effectiveDiscount = getEffectiveDiscount(item);
        const discountedLotPrice = item.basePrice * (1 - effectiveDiscount / 100);

        if (qty === 0) {
          return {
            discountedLotPrice: 0,
            subtotal: 0,
            valid: true,
            message: ''
          };
        }

        const validation = validateQuantity(item);
        if (!validation.valid) {
          return {
            discountedLotPrice: 0,
            subtotal: 0,
            valid: false,
            message: validation.message
          };
        }

        const multiplier = qty / item.lotSize;
        return {
          discountedLotPrice,
          subtotal: multiplier * discountedLotPrice,
          valid: true,
          message: ''
        };
      }

      function updateRowDisplay(itemKey) {
        const item = ammoState.find((entry) => entry.key === itemKey);
        if (!item) return;

        const result = calculateRow(item);
        const qtyInput = document.querySelector(`[data-role="quantity"][data-key="${itemKey}"]`);
        const messageBox = document.querySelector(`[data-role="message"][data-key="${itemKey}"]`);
        const subtotalCell = document.querySelector(`[data-role="subtotal"][data-key="${itemKey}"]`);
        const oldPriceNode = document.querySelector(`[data-key="${itemKey}"] .old-price`);
        const discountBadgeNode = document.querySelector(`[data-key="${itemKey}"] .discount-badge`);
        const newPriceNode = document.querySelector(`[data-key="${itemKey}"] .new-price`);

        if (qtyInput) {
          qtyInput.classList.remove('invalid');
        }

        if (messageBox) {
          messageBox.textContent = '';
          messageBox.classList.remove('show');
        }

        if (subtotalCell) {
          subtotalCell.textContent = result.valid ? formatCompactMoney(result.subtotal) : 'R$ 0,00';
        }

        if (oldPriceNode || discountBadgeNode || newPriceNode) {
          const effectiveDiscount = getEffectiveDiscount(item);
          const discountedBasePrice = item.basePrice * (1 - effectiveDiscount / 100);

          if (oldPriceNode) oldPriceNode.textContent = formatCompactMoney(item.basePrice);
          if (discountBadgeNode) discountBadgeNode.textContent = `-${effectiveDiscount.toFixed(0)}%`;
          if (newPriceNode) newPriceNode.textContent = formatCompactMoney(discountedBasePrice);
        }
      }

      function updateSummary() {
        let totalMunicoes = 0;
        let totalValor = 0;

        ammoState.forEach((item) => {
          const result = calculateRow(item);
          totalMunicoes += Number(item.quantity) || 0;
          totalValor += result.subtotal || 0;
        });

        totalMunicoesElement.textContent = totalMunicoes.toLocaleString('pt-BR');
        valorTotalElement.textContent = formatCompactMoney(totalValor);
      }

      function updateAllRowsAndSummary() {
        ammoState.forEach((item) => updateRowDisplay(item.key));
        updateSummary();
      }

      function applyGeneralDiscount(value) {
        if (Number(value) > 0) {
          state.couponCode = '';
          state.couponEnabled = false;
          document.getElementById('couponInput').value = '';
        }

        ammoState.forEach((item) => {
          item.discount = Number(value) || 0;
          item.customDiscount = '';
        });

        renderTable();
        updateAllRowsAndSummary();
      }

      function getSummaryText() {
        const validRows = ammoState.filter((item) => Number(item.quantity) > 0);

        const lines = validRows.map((item) => {
          const qty = Number(item.quantity);
          const result = calculateRow(item);
          const formattedBase = formatMoney(item.basePrice);

          if (!result.valid) {
            return `${item.label}: ${qty} munições × ${formattedBase} / ${item.lotSize} = ${formatMoney(0)}`;
          }

          return `${item.label}: ${qty} munições × ${formattedBase} / ${item.lotSize} = ${formatMoney(result.subtotal)}`;
        });

        const totalMuni = ammoState.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
        const totalValor = ammoState.reduce((sum, item) => sum + (calculateRow(item).subtotal || 0), 0);

        return [
          'CALCULADORA DE MUNIÇÃO',
          '',
          ...lines,
          '',
          `TOTAL DE MUNIÇÕES: ${totalMuni}`,
          `VALOR TOTAL: ${formatMoney(totalValor)}`
        ].join('\n');
      }

      function bindEvents() {
        document.addEventListener('input', (event) => {
          const target = event.target;

          if (target.matches('[data-role="quantity"]')) {
            const item = ammoState.find((entry) => entry.key === target.dataset.key);
            if (!item) return;

            const sanitized = sanitizeInteger(target.value);
            target.value = sanitized;
            item.quantity = Number(sanitized) || 0;

            updateRowDisplay(item.key);
            updateSummary();
            return;
          }

          if (target.matches('[data-role="custom-discount"]')) {
            const item = ammoState.find((entry) => entry.key === target.dataset.key);
            if (!item) return;

            const cleanValue = sanitizeDecimal(target.value);
            target.value = cleanValue;
            item.customDiscount = cleanValue;

            updateRowDisplay(item.key);
            updateSummary();
          }
        });

        document.addEventListener('change', (event) => {
          const target = event.target;

          if (target.matches('#generalDiscount')) {
            const selectedValue = target.value;
            if (Number(selectedValue) > 0) {
              state.couponCode = '';
              state.couponEnabled = false;
              const couponInput = document.getElementById('couponInput');
              if (couponInput) couponInput.value = '';
            }
            renderTable();
            updateAllRowsAndSummary();
          }
        });

        document.getElementById('applyCoupon').addEventListener('click', () => {
          const input = document.getElementById('couponInput');
          const code = input.value.trim();
          setCouponState(code);

          if (state.couponEnabled) {
            document.getElementById('generalDiscount').value = '0';
          }

          renderTable();
          updateAllRowsAndSummary();
        });

        document.getElementById('clearQuantities').addEventListener('click', () => {
          ammoState.forEach((item) => {
            item.quantity = 0;
          });
          renderTable();
          updateAllRowsAndSummary();
        });

        document.getElementById('copySummary').addEventListener('click', async () => {
          const summaryText = getSummaryText();

          try {
            await navigator.clipboard.writeText(summaryText);
            alert('Resumo copiado com sucesso!');
          } catch (error) {
            const textarea = document.createElement('textarea');
            textarea.value = summaryText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Resumo copiado com sucesso!');
          }
        });
      }

      function initializeApp() {
        renderTable();
        bindEvents();
        updateAllRowsAndSummary();
      }

      initializeApp();
    </script>
  </body>
</html>
